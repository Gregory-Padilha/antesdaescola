<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Antes da Escola™ | Painel Administrativo</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">

  <style>
    :root {
      --bg-warm: #FBF9F5;
      --card-bg: #FFFFFF;
      --color-primary: #EE603B;
      --color-primary-hover: #D94F2B;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
      --border-focus: #EE603B;
      --radius-lg: 16px;
      --radius-md: 10px;
      --shadow-subtle: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-heading: 'Outfit', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-warm);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: radial-gradient(#E2E8F0 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: var(--shadow-subtle);
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--color-primary);
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .login-title {
      font-family: var(--font-heading);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: #FFFFFF;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(238, 96, 59, 0.15);
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      margin-top: 6px;
      background-color: var(--color-primary);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-heading);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-login:hover {
      background-color: var(--color-primary-hover);
    }

    .btn-login:active {
      transform: scale(0.99);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .login-error-alert {
      display: none;
      margin-top: 18px;
      padding: 12px 14px;
      background-color: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: var(--radius-md);
      color: #991B1B;
      font-size: 0.85rem;
      font-weight: 500;
      text-align: center;
    }

    .login-footer-disclaimer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="brand-badge">
          <span>✨</span>
          <span>ANTES DA ESCOLA™</span>
        </div>
        <h1 class="login-title">Painel Administrativo</h1>
      </div>

      <form id="admin-login-form">
        <div class="form-group">
          <label class="form-label" for="login-id">ID</label>
          <input 
            type="text" 
            id="login-id" 
            name="login" 
            class="form-input" 
            placeholder="Digite seu ID" 
            required 
            autocomplete="username"
            autofocus
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Senha</label>
          <input 
            type="password" 
            id="login-password" 
            name="password" 
            class="form-input" 
            placeholder="Digite sua senha" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="btn-submit" class="btn-login">
          ENTRAR
        </button>

        <div id="login-error" class="login-error-alert" role="alert"></div>
      </form>
    </div>

    <div class="login-footer-disclaimer">
      Área privada de gestão e analytics • Antes da Escola™
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('admin-login-form');
      const btnSubmit = document.getElementById('btn-submit');
      const errorBox = document.getElementById('login-error');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        errorBox.style.display = 'none';
        errorBox.textContent = '';
        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Autenticando...';

        const login = document.getElementById('login-id').value.trim();
        const password = document.getElementById('login-password').value;

        try {
          const response = await fetch('/api/admin/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({ login, password })
          });

          const data = await response.json();

          if (response.ok && data.success) {
            window.location.href = data.redirectUrl || '/admin/dashboard';
          } else {
            errorBox.textContent = data.error || 'ID ou senha inválidos.';
            errorBox.style.display = 'block';
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'ENTRAR';
          }
        } catch (err) {
          errorBox.textContent = 'Erro ao conectar ao servidor. Tente novamente.';
          errorBox.style.display = 'block';
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'ENTRAR';
        }
      });
    });
  </script>
</body>
</html>
